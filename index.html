<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>CampusGo Ruta Legal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: un celular con un juego de niveles tipo "saga": mapa vertical con camino de dulce, mundos de colores y ventanas de nivel. Un solo look claro y brillante. */
:root{
  --ink:#3A1460; --ink-2:#6B4A92; --white:#FFFFFF; --cream:#FFF8EC;
  --pink:#FF4FA3; --pink-2:#D62E80; --purple:#8A3FFC; --purple-2:#5B1FB8; --yellow:#FFD23F; --yellow-2:#E8A500;
  --green:#3DDC6F; --green-2:#1FA84B; --blue:#3FB6FF; --blue-2:#1C82D6; --orange:#FF8A2A; --orange-2:#D9620A; --red:#FF4D5E;
  --f-display:"Fredoka","Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;overflow:hidden;font-family:var(--f-body);color:var(--ink);
  background:radial-gradient(circle at 20% 15%,#FF9AD0 0,transparent 35%),radial-gradient(circle at 85% 80%,#9B7BFF 0,transparent 40%),linear-gradient(160deg,#FF6FB5,#8A3FFC)}
.stagewrap{height:100%;box-sizing:border-box;display:grid;place-items:center;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.phone{position:relative;width:min(400px,100%);height:100%;max-height:860px;border-radius:48px;border:10px solid #2A0D4A;background:#2A0D4A;box-shadow:0 0 0 3px rgba(255,255,255,.35),0 24px 60px rgba(42,13,74,.55);overflow:hidden}
.screen{position:absolute;inset:0;border-radius:38px;overflow:hidden;background:#8FD8FF;display:flex;flex-direction:column}
@media (max-width:480px){.stagewrap{padding:0}.phone{width:100%;max-height:none;border:0;border-radius:0;box-shadow:none}.screen{border-radius:0}}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;line-height:1.05;text-wrap:balance}
p{margin:0}
.ic{display:block}
.stroke{color:#fff;text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 4px 0 var(--ink)}

/* botones de caramelo */
.candy-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:3px solid #fff;border-radius:22px;padding:11px 22px;font-family:var(--f-display);font-weight:700;font-size:20px;color:#fff;
  background:linear-gradient(180deg,var(--c1,#5EF08C) 0%,var(--c2,#1FA84B) 100%);box-shadow:0 5px 0 var(--c3,#137535),0 8px 14px rgba(42,13,74,.3);text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .1s}
.candy-btn::before{content:"";position:absolute;left:10px;right:10px;top:4px;height:40%;border-radius:16px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0))}
.candy-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--c3,#137535)}
.candy-btn.pink{--c1:#FF7FC0;--c2:#E23A8E;--c3:#A51F63}
.candy-btn.blue{--c1:#6FD0FF;--c2:#1C82D6;--c3:#125C9A}
.candy-btn.yellow{--c1:#FFE36E;--c2:#F2B000;--c3:#B27F00;color:var(--ink);text-shadow:none}
.candy-btn.purple{--c1:#B58BFF;--c2:#7A2FF0;--c3:#4E17A6}
.candy-btn.sm{font-size:16px;padding:7px 14px;border-radius:18px}
.round{width:46px;height:46px;padding:0;border-radius:50%}
.round svg{width:24px;height:24px;position:relative}

/* HUD */
.hud{position:relative;z-index:5;display:flex;align-items:center;gap:8px;padding:12px 12px 10px;background:linear-gradient(180deg,#7A2FF0,#5B1FB8);border-bottom:4px solid #3A1180}
.pill{display:flex;align-items:center;gap:6px;background:rgba(42,13,74,.55);border:2.5px solid rgba(255,255,255,.7);border-radius:99px;padding:4px 12px 4px 4px;color:#fff;font-family:var(--f-display);font-weight:700;font-size:16px}
.pill .bub{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,var(--yellow) 45%,var(--yellow-2));border:2px solid #fff}
.pill .bub svg{width:18px;height:18px}
.hud .grow{flex:1}

/* splash */
.splash{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:34px 22px 28px;text-align:center;overflow-y:auto;
  background:radial-gradient(circle at 50% 30%,#C9F1FF 0,#8FD8FF 45%,#5EC2FF 100%)}
.splash[hidden]{display:none!important}
.splash .logo{width:min(290px,80%);filter:drop-shadow(0 6px 0 rgba(42,13,74,.25));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.ribbon{position:relative;display:inline-block;background:linear-gradient(180deg,#FF7FC0,#E23A8E);color:#fff;font-family:var(--f-display);font-weight:700;font-size:24px;padding:8px 30px;border:3px solid #fff;border-radius:14px;box-shadow:0 5px 0 #A51F63;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.splash .scene{width:100%;max-width:330px}
.splash .course{font-weight:900;font-size:13px;color:var(--ink);background:rgba(255,255,255,.75);border-radius:14px;padding:8px 12px;border:2.5px solid #fff}
.splash .btns{display:grid;gap:12px;width:100%;max-width:300px}

/* mapa */
.map{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;scroll-behavior:smooth}
.mapin{position:relative}
.mapin>svg{display:block;width:100%;height:auto}
.lvl{position:absolute;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;padding:0;border:4px solid #fff;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.95) 0 9%,var(--c1) 26%,var(--c2) 100%);box-shadow:0 5px 0 var(--c3),0 9px 14px rgba(42,13,74,.35);z-index:2;transition:transform .15s}
.lvl b{font-family:var(--f-display);font-size:25px;color:#fff;text-shadow:-2px -2px 0 var(--c3),2px -2px 0 var(--c3),-2px 2px 0 var(--c3),2px 2px 0 var(--c3)}
.lvl:hover{transform:translate(-50%,-50%) scale(1.08)}
.lvl.boss{width:80px;height:80px}
.lvl.boss b{font-size:30px}
.lvl .stars{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);display:flex;gap:1px}
.lvl .stars i{width:16px;height:16px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:rgba(42,13,74,.35)}
.lvl .stars i.on{background:var(--yellow);filter:drop-shadow(0 0 2px #fff)}
.lvl .stars i:nth-child(2){transform:translateY(-4px)}
.lvl.cur{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 5px 0 var(--c3),0 0 0 10px rgba(255,255,255,.55),0 9px 14px rgba(42,13,74,.35)}}
.lvl .lk{position:absolute;inset:0;display:grid;place-items:center}
.me{position:absolute;width:54px;height:66px;transform:translate(-50%,-100%);z-index:3;pointer-events:none;transition:left .6s,top .6s;animation:hop 1s ease-in-out infinite}
@keyframes hop{50%{transform:translate(-50%,calc(-100% - 8px))}}
.me .av{width:54px;height:54px;border-radius:50%;overflow:hidden;border:4px solid #fff;box-shadow:0 4px 0 var(--ink)}
.me::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);border:8px solid transparent;border-top:10px solid #fff;border-bottom:0}
.world{position:absolute;left:50%;transform:translate(-50%,-50%);z-index:2;white-space:nowrap;text-align:center}
.world .ribbon{font-size:17px;padding:5px 18px;border-radius:12px}
.world small{display:block;margin-top:6px;font-weight:900;font-size:12px;color:var(--ink);background:rgba(255,255,255,.85);border-radius:99px;padding:2px 10px}
.nextbar{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:10px}
.nextbar .candy-btn{flex:1}

/* ventana de nivel */
.modal{position:absolute;inset:0;z-index:20;background:rgba(42,13,74,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;opacity:0;visibility:hidden;transition:.25s}
.modal.on{opacity:1;visibility:visible}
.card{position:relative;width:100%;max-height:92%;overflow-y:auto;background:linear-gradient(180deg,#FFF6FB,#FFFFFF 40%);border-radius:30px 30px 0 0;border:4px solid #fff;box-shadow:0 -6px 0 rgba(255,255,255,.4);padding:0 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(40px);transition:transform .3s cubic-bezier(.2,1.3,.4,1)}
.modal.on .card{transform:none}
.card .top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:14px 0 10px;background:linear-gradient(#FFF6FB 70%,rgba(255,246,251,0))}
.card .top .ribbon{flex:1;text-align:center;font-size:18px;padding:6px 8px}
.hero{display:flex;align-items:center;gap:14px;margin:4px 0 12px}
.gem{flex:none;width:96px;height:96px;border-radius:28px;border:4px solid #fff;display:grid;place-items:center;background:radial-gradient(circle at 34% 28%,#fff 0 10%,var(--c1) 30%,var(--c2));box-shadow:0 5px 0 var(--c3),0 10px 18px rgba(42,13,74,.25);transform:rotate(-6deg)}
.gem svg{width:64px;height:64px}
.hero h2{font-size:28px;color:var(--ink)}
.hero .src{display:inline-block;margin-top:6px;font-weight:900;font-size:11.5px;color:var(--ink-2);background:#F1E6FF;border-radius:99px;padding:3px 10px}
.cg{display:flex;gap:10px;align-items:center;background:linear-gradient(180deg,#E9F8FF,#D3F0FF);border:3px solid #fff;border-radius:18px;padding:10px 12px;box-shadow:0 3px 0 #9CD6F5;font-weight:900;font-size:16px;line-height:1.25}
.cg svg{width:38px;height:38px;flex:none}
.cg span{display:block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--blue-2)}
.q{font-family:var(--f-display);font-weight:700;font-size:19px;margin:16px 2px 8px;color:var(--ink)}
.opt{display:block;width:100%;margin-top:8px;border:3px solid #fff;border-radius:18px;padding:11px 14px;text-align:left;font-weight:900;font-size:16px;background:linear-gradient(180deg,#FFFFFF,#F3EAFF);box-shadow:0 4px 0 #C9B2F0;color:var(--ink)}
.opt.good{background:linear-gradient(180deg,#8AF5AE,#3DDC6F);box-shadow:0 4px 0 #1FA84B;color:#0B4220}
.opt.bad{background:linear-gradient(180deg,#FFB3BC,#FF6B7A);box-shadow:0 4px 0 #C9364A;color:#5A0E1A}
.candies{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.cnd{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.cnd svg{width:100%;max-width:104px;height:auto;transition:transform .3s}
.cnd:not(.open) svg{animation:wiggle 2.2s ease-in-out infinite;animation-delay:calc(var(--k)*.25s)}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-8deg)}90%{transform:rotate(8deg)}95%{transform:rotate(-4deg)}}
.cnd b{font-family:var(--f-display);font-size:15px}
.cnd .txt{min-height:58px;font-weight:900;font-size:13px;line-height:1.2;text-align:center;opacity:0;transform:scale(.8);transition:.3s}
.cnd.open .txt{opacity:1;transform:none}
.cnd.open svg{transform:scale(.85)}
.tip{text-align:center;font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--pink-2);margin-top:10px}
.win{margin-top:14px;text-align:center;display:none}
.win.on{display:block;animation:winpop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes winpop{from{transform:scale(.6)}to{transform:none}}
.bigstars{display:flex;justify-content:center;gap:6px;margin-bottom:6px}
.bigstars i{width:46px;height:46px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:#E3D6F5}
.bigstars i.on{background:linear-gradient(#FFF0A0,#FFC400);animation:star .5s both;animation-delay:calc(var(--k)*.15s)}
.bigstars i:nth-child(2){width:58px;height:58px;margin-top:-8px}
@keyframes star{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.win h3{font-size:26px}
.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:16px}

/* SOS y ecuación */
.sosb{display:block;margin:14px auto 6px;width:150px;height:150px;border-radius:50%;border:5px solid #fff;background:radial-gradient(circle at 34% 28%,#fff 0 8%,#FF8A96 26%,#E0233A);box-shadow:0 6px 0 #9E1426,0 0 0 0 rgba(255,77,94,.5);animation:sosring 1.6s infinite;padding:0}
@keyframes sosring{70%{box-shadow:0 6px 0 #9E1426,0 0 0 22px rgba(255,77,94,0)}}
.sosb svg{width:96px;height:96px;margin:auto}
.tog{display:grid;grid-template-columns:1fr 1fr;width:220px;margin:8px auto 0;border:3px solid #fff;border-radius:99px;overflow:hidden;box-shadow:0 3px 0 #C9B2F0;background:#F3EAFF}
.tog button{border:0;background:none;padding:7px 0;font-family:var(--f-display);font-weight:700;font-size:16px}
.tog button.on{background:var(--purple);color:#fff}
.steps{display:grid;gap:8px;margin-top:12px}
.stp{display:flex;gap:10px;align-items:center;border:3px solid #fff;border-radius:16px;padding:8px 10px;background:#F3EAFF;opacity:.4;transition:.3s;font-weight:900;font-size:14.5px}
.stp svg{width:32px;height:32px;flex:none}
.stp.on{opacity:1}.stp.ok{background:#C9F7D8}.stp.fail{background:#FFD3D8}
.sl{margin-top:12px}
.sl label{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:15px}
.sl label svg{width:28px;height:28px;margin-right:6px}
.sl label span{display:flex;align-items:center}
.sl input{width:100%;accent-color:var(--purple)}
.meter{height:22px;border:3px solid #fff;border-radius:99px;background:#E3D6F5;overflow:hidden;box-shadow:0 3px 0 #C9B2F0;margin-top:10px}
.meter i{display:block;height:100%;transition:width .3s,background .3s}
.verdict{text-align:center;font-family:var(--f-display);font-weight:700;font-size:20px;margin-top:8px}

/* equipo */
.team{display:grid;gap:8px;margin-top:6px}
.mate{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid #F1E6FF;border-radius:16px;padding:7px 10px;box-shadow:0 3px 0 #E3D6F5}
.mate .av{width:44px;height:44px;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 2px 0 var(--ink-2);flex:none}
.mate b{font-family:var(--f-display);font-size:15px;display:block}
.mate span{font-size:12px;font-weight:800;color:var(--ink-2)}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.srcs span{font-weight:900;font-size:12px;background:#F1E6FF;border-radius:99px;padding:3px 10px;color:var(--ink-2)}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(900px) rotate(600deg)}}

.timer{flex:none;font-family:var(--f-display);font-weight:700;font-size:16px;color:#fff;background:linear-gradient(180deg,#B58BFF,#7A2FF0);border:3px solid #fff;border-radius:99px;padding:5px 10px;box-shadow:0 3px 0 #4E17A6;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.timer.late{background:linear-gradient(180deg,#FF8A96,#E0233A);box-shadow:0 3px 0 #9E1426;animation:tick .5s ease-in-out infinite alternate}
@keyframes tick{to{transform:scale(1.08)}}
.candies.n4{grid-template-columns:repeat(4,1fr);gap:6px}
.candies.n4 b{font-size:12.5px}
.cnd{position:relative}
.cnd.open::after{content:"✓";position:absolute;top:-4px;right:2px;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;border:2px solid #fff;font-weight:900;font-size:13px;display:grid;place-items:center}
.cnd.sel svg{transform:scale(1.12)!important;filter:drop-shadow(0 0 8px rgba(255,79,163,.8))}
.cnd b{line-height:1.1;text-align:center}
.det{margin-top:12px;background:#fff;border:3px solid #F1E6FF;border-radius:20px;padding:12px;box-shadow:0 4px 0 #E3D6F5;display:grid;gap:8px;min-height:60px;animation:winpop .35s cubic-bezier(.2,1.5,.4,1)}
.det .tip{margin:0}
.dh{display:flex;gap:10px;align-items:center}
.dgem{width:46px;height:46px;flex:none;border-radius:14px;background:linear-gradient(180deg,#FFF0F8,#F1E6FF);border:2px solid #fff;box-shadow:0 2px 0 #E3D6F5;display:grid;place-items:center}
.dgem svg{width:34px;height:34px}
.dh b{font-family:var(--f-display);font-size:20px;display:block}
.dh .src{display:inline-block;margin-top:2px;font-weight:900;font-size:11px;color:var(--ink-2);background:#F1E6FF;border-radius:99px;padding:2px 8px}
.dd{font-weight:900;font-size:15.5px}
.dx{font-weight:800;font-size:14px;background:#FFF1D6;border-radius:12px;padding:6px 10px}
.pce{display:grid;gap:5px}
.pce div{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:center;font-weight:800;font-size:13.5px;line-height:1.2}
.pce i{font-style:normal;font-family:var(--f-display);font-weight:700;font-size:12.5px;text-align:center;color:#fff;border-radius:99px;padding:3px 0}
.pce div:nth-child(1) i{background:#F2B000}.pce div:nth-child(2) i{background:#FF8A2A}.pce div:nth-child(3) i{background:#E0233A}
.det .cg{font-size:14.5px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

 {w:2,type:'sos',icon:'i-sos',t:'Jefe: botón SOS',cg:'Al ofrecer el SOS, CampusGo es garante de quien pide ayuda.',src:'Video posición de garante · Código Penal art. 25'},
 {w:2,type:'eq',icon:'i-moneda',t:'Jefe final: la ecuación',cg:'Riqueza + función social + medio ambiente = éxito.',src:'Constitución art. 333 · casos Temu y aguacate'}];

/* estado */

try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const total=()=>Object.values(S.stars).reduce((a,b)=>a+b,0);
const nextLvl=()=>{const i=L.findIndex((_,k)=>!S.stars[k]);return i<0?L.length-1:i;};

function rng(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;}}
function buildMap(){
 let d=`M${POS[0][0]} ${H+30}`;const P=[[POS[0][0],H+30],...POS,[180,-30]];
 d=`M${P[0][0]} ${P[0][1]}`;for(let i=0;i<P.length-1;i++){const p0=P[Math.max(i-1,0)],p1=P[i],p2=P[i+1],p3=P[Math.min(i+2,P.length-1)];
  d+=` C${p1[0]+(p2[0]-p0[0])/6} ${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6} ${p2[1]-(p3[1]-p1[1])/6} ${p2[0]} ${p2[1]}`;}
 const wy=w=>{const ids=L.map((l,i)=>l.w===w?i:-1).filter(i=>i>=0);return [POS[ids[ids.length-1]][1]-SP/2,POS[ids[0]][1]+SP/2];};
 let bands='';W.forEach((w,k)=>{let [y0,y1]=wy(k);if(k===0)y1=H;if(k===W.length-1)y0=0;bands+=`<defs><linearGradient id="wg${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${w.bg[1]}"/><stop offset="1" stop-color="${w.bg[0]}"/></linearGradient></defs><rect x="0" y="${y0}" width="360" height="${y1-y0}" fill="url(#wg${k})"/>`;});
 const R=rng(5);let deco='';const near=(x,y)=>POS.some(([a,b])=>Math.hypot(a-x,b-y)<62)||[...Array(60).keys()].some(t=>{const i=Math.floor(t/3);if(i>=POS.length-1)return false;const f=(t%3)/3,a=POS[i],b=POS[i+1];return Math.hypot(a[0]+(b[0]-a[0])*f-x,a[1]+(b[1]-a[1])*f-y)<46;});
 for(let k=0;k<900&&deco.length<60000;k++){const x=16+R()*328,y=40+R()*(H-80);if(near(x,y))continue;const w=L[Math.min(L.length-1,Math.max(0,Math.round((H-BOT-y)/SP)))].w;const r=R();
  if(w===0){deco+=r<.5?`<g opacity=".95"><circle cx="${x}" cy="${y}" r="13" fill="#fff"/><circle cx="${x+13}" cy="${y+3}" r="10" fill="#fff"/><circle cx="${x-12}" cy="${y+4}" r="9" fill="#fff"/></g>`:`<g><rect x="${x-2}" y="${y}" width="4" height="22" rx="2" fill="#fff"/><circle cx="${x}" cy="${y}" r="11" fill="#FF4FA3" stroke="#fff" stroke-width="3"/><path d="M${x-6} ${y-3}q6-6 12 0" stroke="#fff" stroke-width="2.5" fill="none"/></g>`;}
  else if(w===1){deco+=r<.5?`<path d="M${x} ${y-12}l3.5 8 8.5.8-6.4 5.6 2 8.4-7.6-4.6-7.6 4.6 2-8.4-6.4-5.6 8.5-.8Z" fill="#FFD23F" stroke="#fff" stroke-width="2.5"/>`:`<g><circle cx="${x}" cy="${y}" r="11" fill="#8A3FFC" stroke="#fff" stroke-width="3"/><circle cx="${x-3}" cy="${y-3}" r="3" fill="#fff" opacity=".7"/></g>`;}
  else if(w===2){deco+=r<.55?`<g><rect x="${x-3}" y="${y+4}" width="6" height="12" fill="#A0673C"/><circle cx="${x}" cy="${y}" r="13" fill="#3DDC6F" stroke="#fff" stroke-width="3"/><circle cx="${x-4}" cy="${y-4}" r="4" fill="#9CF5B9"/></g>`:`<g stroke="#fff" stroke-width="2.5"><rect x="${x-15}" y="${y-8}" width="30" height="24" fill="#FFF8EC"/><path d="M${x-19} ${y-7}L${x} ${y-21}L${x+19} ${y-7}Z" fill="${['#FF4FA3','#3FB6FF','#FF8A2A'][k%3]}"/><rect x="${x-4}" y="${y+5}" width="8" height="11" fill="#3FB6FF"/></g>`;}
  else{deco+=r<.5?`<g><circle cx="${x}" cy="${y}" r="12" fill="#FF8A2A" stroke="#fff" stroke-width="3"/><path d="M${x-12} ${y}h24M${x} ${y-12}v24" stroke="#fff" stroke-width="2"/></g>`:`<path d="M${x} ${y-12}l3.5 8 8.5.8-6.4 5.6 2 8.4-7.6-4.6-7.6 4.6 2-8.4-6.4-5.6 8.5-.8Z" fill="#fff"/>`;}
  if(k%14===13&&deco.length>12000)break;}
 const svg=`<svg viewBox="0 0 360 ${H}" aria-hidden="true">${bands}${deco}
  <path d="${d}" fill="none" stroke="#fff" stroke-width="40" stroke-linecap="round"/>
  <path d="${d}" fill="none" stroke="#FF8CC6" stroke-width="30" stroke-linecap="round"/>
  <path d="${d}" fill="none" stroke="#fff" stroke-width="30" stroke-dasharray="10 16" stroke-linecap="butt" opacity=".75"/>
  <path d="${d}" fill="none" stroke="#FFE36E" stroke-width="6" stroke-dasharray="2 18" stroke-linecap="round" class="road-run"/></svg>`;
 const worlds=W.map((w,k)=>{const first=L.findIndex(l=>l.w===k);const y=POS[first][1]+SP/2+ (k===0?40:0);return `<div class="world" style="top:${y}px"><div class="ribbon" style="background:linear-gradient(180deg,${w.c[0]},${w.c[1]});box-shadow:0 4px 0 ${w.c[2]}">${w.n} · ${w.t}</div>${k===1?'<small>Pre · Contractual · Extra en cada parada</small>':''}</div>`;}).join('');
 const lv=L.map((l,i)=>{const c=W[l.w].c;return `<button class="lvl ${l.type==='sos'||l.type==='eq'?'boss':''}" data-l="${i}" style="left:${POS[i][0]/360*100}%;top:${POS[i][1]}px;--c1:${c[0]};--c2:${c[1]};--c3:${c[2]}" aria-label="Nivel ${i+1}: ${l.t}"><b>${i+1}</b><span class="stars"><i></i><i></i><i></i></span></button>`;}).join('');
 $('#mapin').style.height=0;$('#mapin').innerHTML=svg+worlds+lv+`<div class="me" id="me"><div class="av">${face(TEAM[2][2])}</div></div>`;
 fitMap();$$('.lvl').forEach(b=>b.onclick=()=>openLvl(+b.dataset.l));refresh();}
function fitMap(){const w=$('#mapin').clientWidth||360,k=w/360;$('#mapin').style.height=(H*k)+'px';
 $$('.lvl').forEach(b=>b.style.top=(POS[+b.dataset.l][1]*k)+'px');$$('.world').forEach((el,i)=>{const first=L.findIndex(l=>l.w===i);el.style.top=((POS[first][1]+SP/2+(i===0?40:0))*k)+'px';});placeMe();}
addEventListener('resize',fitMap);
function placeMe(){const k=($('#mapin').clientWidth||360)/360,i=nextLvl(),me=$('#me');if(!me)return;me.style.left=(POS[i][0]/360*100)+'%';me.style.top=((POS[i][1]-40)*k)+'px';}
function refresh(){const nx=nextLvl();$$('.lvl').forEach(b=>{const i=+b.dataset.l,s=S.stars[i]||0;b.classList.toggle('cur',i===nx&&!S.stars[i]);b.querySelectorAll('.stars i').forEach((st,k)=>st.classList.toggle('on',k<s));});
 $('#starsT').textContent=`${total()}/24`;$('#lvlT').textContent=`Nivel ${nx+1}`;$('#playNext').textContent=total()>=24?'¡Ruta completa! ★':`▶ Jugar nivel ${nx+1}`;placeMe();}
function scrollToLvl(i,smooth){const m=$('#map'),k=($('#mapin').clientWidth||360)/360;m.style.scrollBehavior=smooth?'smooth':'auto';m.scrollTop=POS[i][1]*k-m.clientHeight*.55;}

/* ventana de nivel */
let tmr=null;function startTimer(){clearInterval(tmr);let t=60;const el=$('#timer');if(!el)return;tmr=setInterval(()=>{t--;if(!el.isConnected){clearInterval(tmr);return;}el.textContent=t>0?`0:${String(t).padStart(2,'0')}`:'¡Tiempo!';el.classList.toggle('late',t<=10);if(t<=0)clearInterval(tmr);},1000);}
function closeLvl(){clearInterval(tmr);$('#modal').classList.remove('on');}
function confetti(){const c=$('#conf'),cols=['#FF4FA3','#FFD23F','#3DDC6F','#3FB6FF','#8A3FFC','#FF8A2A'];c.innerHTML=Array.from({length:50},(_,k)=>`<i style="left:${(k*29)%100}%;background:${cols[k%6]};animation-delay:${(k%10)*.06}s"></i>`).join('');setTimeout(()=>c.innerHTML='',2400);}
function award(i,n){const prev=S.stars[i]||0;S.stars[i]=Math.max(prev,n);save();refresh();const w=$('#win');w.classList.add('on');
 w.querySelectorAll('.bigstars i').forEach((s,k)=>s.classList.toggle('on',k<n));w.querySelector('h3').textContent=n===3?'¡Nivel superado!':'¡Bien! Repite por 3 estrellas';if(n===3)confetti();

const CANDY=(c1,c2,ic)=>`<svg viewBox="0 0 120 70"><path d="M24 35 4 14v42Z" fill="${c2}" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><path d="M96 35l20-21v42Z" fill="${c2}" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><ellipse cx="60" cy="35" rx="38" ry="28" fill="${c1}" stroke="#fff" stroke-width="4"/><path d="M36 22c10 12 38 12 48 26" stroke="#fff" stroke-width="5" opacity=".6" fill="none"/><ellipse cx="46" cy="23" rx="10" ry="5" fill="#fff" opacity=".7"/>${ic?`<circle cx="60" cy="35" r="19" fill="#fff" opacity=".92"/><svg x="44" y="19" width="32" height="32" viewBox="0 0 64 64"><use href="#${ic}"/></svg>`:''}</svg>`;
function openLvl(i){const l=L[i],c=W[l.w].c;let body='';

 if(l.type==='pack')body=`<p class="q">Abre los ${l.items.length} dulces</p><div class="candies n${l.items.length}">${l.items.map((it,j)=>`<button class="cnd" data-j="${j}" style="--k:${j}">${CANDY(CC[j%4][0],CC[j%4][1],it.icon)}<b>${it.t}</b></button>`).join('')}</div><div class="det" id="det"><p class="tip">Toca un dulce para abrirlo ☝</p></div>`;
 if(l.type==='sos')body=`<button class="sosb" id="sosB" aria-label="Pulsar SOS">${use('i-sos')}</button><p class="q" style="text-align:center;margin-top:4px">¿CampusGo responde?</p><div class="tog"><button class="on" data-r="1">Sí</button><button data-r="0">No</button></div>
  <div class="steps"><div class="stp" id="s1">${use('i-sos')}Una estudiante pulsa SOS</div><div class="stp" id="s2">${use('i-garante')}La app avisa a seguridad del campus</div><div class="stp" id="s3">${use('i-escudo')}<span id="s3t">…</span></div></div>`;
 if(l.type==='eq')body=`<p class="q">Equilibra la ecuación para ganar</p>${[['R','i-moneda','Riqueza',9],['S','i-manos','Función social',2],['A','i-mundo','Medio ambiente',1]].map(([k,ic,t,v])=>`<div class="sl"><label for="e${k}"><span>${use(ic)}${t}</span><b id="v${k}">${v}</b></label><input type="range" id="e${k}" min="0" max="10" value="${v}"></div>`).join('')}
  <div class="meter"><i id="eM"></i></div><p class="verdict" id="eV"></p>`;
 $('#card').innerHTML=`<div class="top"><button class="candy-btn yellow round" id="cHome" aria-label="Volver al inicio"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3Z" fill="#3A1460"/></svg></button>
   <div class="ribbon" style="background:linear-gradient(180deg,${c[0]},${c[1]});box-shadow:0 4px 0 ${c[2]}">Nivel ${i+1}</div><div class="timer" id="timer">1:00</div>
   <button class="candy-btn pink round" id="cClose" aria-label="Volver al mapa"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></svg></button></div>
  <div class="hero"><div class="gem" style="--c1:${c[0]};--c2:${c[1]};--c3:${c[2]}">${use(l.icon)}</div><div><h2>${l.t}</h2><span class="src">◆ ${l.src}</span></div></div>
  ${l.cg?`<div class="cg">${use('i-idea')}<div><span>EN CAMPUSGO</span>${l.cg}</div></div>`:''}${body}
  <div class="win" id="win"><div class="bigstars"><i style="--k:0"></i><i style="--k:1"></i><i style="--k:2"></i></div><h3></h3>
   <div class="actions"><button class="candy-btn blue sm" id="wMap">Mapa</button><button class="candy-btn sm" id="wNext">${i<L.length-1?'Siguiente ▶':'Ver equipo ★'}</button></div></div>`;
 $('#modal').classList.add('on');$('#card').scrollTop=0;startTimer();
 $('#cClose').onclick=()=>{closeLvl();};$('#cHome').onclick=goHome;$('#wMap').onclick=()=>{closeLvl();scrollToLvl(nextLvl(),true);};
 $('#wNext').onclick=()=>{if(i<L.length-1){openLvl(i+1);scrollToLvl(i+1,true);}else{closeLvl();openTeam();}};
 if(l.type==='quiz'){let tries=0;$$('.opt').forEach(o=>o.onclick=()=>{const k=+o.dataset.k;if(o.disabled)return;tries++;
   if(k===l.ok){$$('.opt').forEach(x=>x.disabled=true);o.classList.add('good');award(i,tries===1?3:tries===2?2:1);}else{o.classList.add('bad');o.disabled=true;}});}
 if(l.type==='ruta'){const opened=new Set();$$('.cnd').forEach(b=>b.onclick=()=>{b.classList.add('open');opened.add(b.dataset.k);$('#tip').textContent=opened.size<3?`${opened.size}/3 dulces`:'¡Análisis completo!';if(opened.size===3&&!$('#win').classList.contains('on'))award(i,3);});}
 if(l.type==='pack'){const opened=new Set();$$('.cnd').forEach(b=>b.onclick=()=>{const j=+b.dataset.j,it=l.items[j];$$('.cnd').forEach(x=>x.classList.toggle('sel',x===b));b.classList.add('open');opened.add(j);
   $('#det').innerHTML=`<div class="dh"><span class="dgem">${use(it.icon)}</span><div><b>${it.t}</b><span class="src">◆ ${it.src}</span></div></div>${it.d?`<p class="dd">${it.d}</p>`:''}${it.ex?`<p class="dx"><b>${it.ex[0]}:</b> ${it.ex[1]}</p>`:''}${it.pre?`<div class="pce"><div><i>Pre</i>${it.pre}</div><div><i>Contractual</i>${it.con}</div><div><i>Extra</i>${it.ext}</div></div>`:''}<div class="cg">${use('i-idea')}<div><span>EN CAMPUSGO</span>${it.cg}</div></div><p class="tip">${opened.size}/${l.items.length} dulces abiertos</p>`;
   if(opened.size===l.items.length&&!$('#win').classList.contains('on'))setTimeout(()=>award(i,3),300);});}
 if(l.type==='sos'){let resp=true,tm=[];$$('.tog button').forEach(b=>b.onclick=()=>{resp=b.dataset.r==='1';$$('.tog button').forEach(x=>x.classList.toggle('on',x===b));});
  $('#sosB').onclick=()=>{tm.forEach(clearTimeout);['#s1','#s2','#s3'].forEach(s=>$(s).className='stp');$('#s3t').textContent='…';
   tm=[setTimeout(()=>$('#s1').classList.add('on'),100),setTimeout(()=>$('#s2').classList.add('on'),700),setTimeout(()=>{$('#s3').classList.add('on',resp?'ok':'fail');
    $('#s3t').textContent=resp?'Llega ayuda: CampusGo cumplió como garante':'Nadie responde: comisión por omisión (art. 25)';if(resp)award(i,3);},1400)];};}
 if(l.type==='eq'){const r=$('#eR'),s=$('#eS'),a=$('#eA');let won=false;const upd=()=>{const R=+r.value,X=+s.value,A=+a.value;$('#vR').textContent=R;$('#vS').textContent=X;$('#vA').textContent=A;

   const m=$('#eM');m.style.width=ex+'%';m.style.background=g;$('#eV').textContent=`${t} · ${ex} %`;if(g==='#3DDC6F'&&!won){won=true;award(i,3);}};
  [r,s,a].forEach(x=>x.addEventListener('input',upd));upd();}
}

 ${[[40,118,'#1C82D6','1'],[120,124,'#7A2FF0','2'],[205,118,'#1FA84B','3'],[285,108,'#E23A8E','4']].map(([x,y,c,n])=>`<g><circle cx="${x}" cy="${y}" r="17" fill="${c}" stroke="#fff" stroke-width="4"/><text x="${x}" y="${y+6}" text-anchor="middle" font-family="Fredoka,sans-serif" font-weight="700" font-size="17" fill="#fff">${n}</text></g>`).join('')}
 <g transform="translate(150 6)"><path d="M30 0c17 0 30 13 30 29 0 22-30 52-30 52S0 51 0 29C0 13 13 0 30 0Z" fill="#FF8A2A" stroke="#fff" stroke-width="4"/><circle cx="30" cy="29" r="19" fill="#FFF8EC"/><svg x="14" y="13" width="32" height="32" viewBox="0 0 64 64"><use href="#i-balanza"/></svg></g>`;

const st=document.createElement('style');st.textContent='.road-run{animation:run 1.2s linear infinite}@keyframes run{to{stroke-dashoffset:-40}}';document.head.appendChild(st);

if(total()>0){$('#splash').hidden=false;}
